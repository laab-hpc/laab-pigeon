
stages:
  - test
  - deploy

pytest:
  stage: test
  script:
    - python -m venv venv
    - . venv/bin/activate
    - python -m pip install --upgrade pip
    - pip install -e packages/pigeon_client
    - pip install -e packages/pigeon_server
    - pip install -e packages/pigeon_dispatch
    - pip install pytest
    - pytest -q packages/pigeon_client/test
    - pytest -q packages/pigeon_server/test
    - pytest -q packages/pigeon_dispatch/test

pages:
  stage: deploy
  script:
    - python -m venv venv
    - . venv/bin/activate
    - python -m pip install --upgrade pip
    - pip install -r docs/requirements.txt
    - pip install -e packages/pigeon_client
    - pip install -e packages/pigeon_server
    - pip install -e packages/pigeon_dispatch
    - make -C docs clean
    - make -C docs html
    - mkdir -p public
    - cp -r docs/_build/html/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
